name: Build desktop mods

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SYMGEN_VERSION: v1.3.6
  SYMGEN_LINUX_X86_64_SHA256: 236bc5cd4bda03a8dd53a4531efff1fec3bcd19b09890893b9b6f8f5ae77f041

jobs:
  dusklight-sdk:
    name: Resolve Dusklight SDK revision
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - name: Resolve upstream default branch
        id: resolve
        shell: bash
        run: |
          revision=$(git ls-remote https://github.com/TwilitRealm/dusklight.git HEAD | cut -f1)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Building against Dusklight $revision"

  build:
    name: Build ${{ matrix.platform }}
    needs: dusklight-sdk
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-latest
          - platform: macos-x86_64
            runner: macos-latest
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - platform: windows-amd64
            runner: windows-latest
            msvc_arch: amd64
          - platform: windows-arm64
            runner: windows-11-arm
            msvc_arch: amd64_arm64

    steps:
      - name: Check out Dusklight GZ
        uses: actions/checkout@v4

      - name: Check out the pinned Dusklight SDK
        uses: actions/checkout@v4
        with:
          repository: TwilitRealm/dusklight
          ref: ${{ needs.dusklight-sdk.outputs.revision }}
          path: host-sdk
          fetch-depth: 1
          submodules: recursive

      - name: Enable Visual Studio environment
        if: matrix.msvc_arch
        uses: step-security/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Ninja on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install ninja --no-progress --yes

      - name: Configure on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dusklight_dir="$(cd host-sdk && pwd)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            "-DDUSK_DIR=${dusklight_dir}" \
            ${{ matrix.cmake_args }}

      - name: Configure on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $dusklightDir = (Resolve-Path -LiteralPath 'host-sdk').Path
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON `
            "-DDUSK_DIR=$dusklightDir"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.platform }}
          path: build/mods/*.dusk
          if-no-files-found: error
  combine:
    name: Combine desktop packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out Dusklight GZ
        uses: actions/checkout@v4

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: mod-*
          path: artifacts
          merge-multiple: false

      - name: Install symgen
        run: |
          curl -fsSL -o symgen \
            "https://github.com/encounter/symgen/releases/download/${SYMGEN_VERSION}/symgen-linux-x86_64"
          echo "${SYMGEN_LINUX_X86_64_SHA256}  symgen" | sha256sum --check --strict
          chmod +x symgen

      - name: Build and validate combined package
        run: |
          python3 .github/scripts/merge_mod.py \
            --output dist/dusklight_gz.dusk \
            --symgen ./symgen \
            artifacts/*/*.dusk
          (cd dist && sha256sum dusklight_gz.dusk > dusklight_gz.dusk.sha256)

      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: dusklight-gz-all-platforms
          path: |
            dist/dusklight_gz.dusk
            dist/dusklight_gz.dusk.sha256
          if-no-files-found: error
